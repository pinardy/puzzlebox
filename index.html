<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2733" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PuzzleBox — Puzzle Games</title>
    <script>
      // Stamp the theme before first paint so a saved choice (or a dark OS
      // preference) never flashes the light palette. Kept in sync afterwards
      // by the header toggle in the app.
      (function () {
        var theme = null;
        try {
          theme = JSON.parse(localStorage.getItem("puzzlebox:pref:theme"));
        } catch (e) {
          /* no storage — fall through to the OS preference */
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        // Match the browser/status-bar chrome to the page's paper colour;
        // lib/theme.ts keeps it in sync from here.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute("content", theme === "dark" ? "#14181e" : "#eef1f4");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
